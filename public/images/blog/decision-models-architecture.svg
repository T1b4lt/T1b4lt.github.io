<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="440" rx="16" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">The shared architecture of decision models</text>
  <text x="450" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">a pretrained reader + a small head that scores options instead of generating text</text>

  <!-- State -->
  <rect x="30" y="160" width="160" height="100" rx="8" fill="#a78bfa" opacity="0.18"/>
  <rect x="30" y="160" width="160" height="4" rx="2" fill="#a78bfa"/>
  <text x="110" y="188" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">State</text>
  <text x="110" y="210" text-anchor="middle" fill="#c4b5fd" font-size="11">"Help! My payouts</text>
  <text x="110" y="226" text-anchor="middle" fill="#c4b5fd" font-size="11">have been failing</text>
  <text x="110" y="242" text-anchor="middle" fill="#c4b5fd" font-size="11">for 3 days."</text>

  <line x1="195" y1="210" x2="222" y2="210" stroke="#64748b" stroke-width="2"/>
  <polygon points="230,210 220,205 220,215" fill="#64748b"/>

  <!-- Tokens -->
  <rect x="235" y="185" width="85" height="50" rx="8" fill="#334155"/>
  <text x="277" y="215" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">tokens</text>

  <line x1="325" y1="210" x2="347" y2="210" stroke="#64748b" stroke-width="2"/>
  <polygon points="355,210 345,205 345,215" fill="#64748b"/>

  <!-- Backbone -->
  <rect x="360" y="140" width="150" height="140" rx="8" fill="#6366f1" opacity="0.18"/>
  <rect x="360" y="140" width="150" height="4" rx="2" fill="#6366f1"/>
  <text x="435" y="180" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Pretrained</text>
  <text x="435" y="198" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">backbone</text>
  <text x="435" y="222" text-anchor="middle" fill="#a5b4fc" font-size="11">Qwen &#183; ModernBERT &#183; ?</text>
  <text x="435" y="246" text-anchor="middle" fill="#64748b" font-size="11">knows how to read</text>
  <text x="435" y="262" text-anchor="middle" fill="#64748b" font-size="11">frozen or nearly so</text>

  <line x1="515" y1="210" x2="537" y2="210" stroke="#64748b" stroke-width="2"/>
  <polygon points="545,210 535,205 535,215" fill="#64748b"/>

  <!-- Latent state -->
  <rect x="550" y="170" width="110" height="80" rx="8" fill="#059669" opacity="0.2"/>
  <rect x="550" y="170" width="110" height="4" rx="2" fill="#059669"/>
  <text x="605" y="200" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">latent state</text>
  <text x="605" y="220" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">computed once</text>
  <text x="605" y="236" text-anchor="middle" fill="#64748b" font-size="10">reused by every question</text>

  <!-- Fan-out arrows -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0.8">
    <path d="M665,195 C685,195 680,115 700,115"/>
    <path d="M665,210 L700,210"/>
    <path d="M665,225 C685,225 680,305 700,305"/>
  </g>

  <!-- Questions -->
  <g>
    <rect x="705" y="80" width="170" height="70" rx="8" fill="#22d3ee" opacity="0.14"/>
    <text x="790" y="102" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">is_urgent &#183; noul</text>
    <text x="790" y="118" text-anchor="middle" fill="#64748b" font-size="10">head &#8594; softmax</text>
    <text x="790" y="138" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="700">0.95</text>
  </g>
  <g>
    <rect x="705" y="175" width="170" height="70" rx="8" fill="#22d3ee" opacity="0.14"/>
    <text x="790" y="197" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">department &#183; choice</text>
    <text x="790" y="213" text-anchor="middle" fill="#64748b" font-size="10">head &#8594; softmax</text>
    <text x="790" y="233" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="700">billing &#183; 0.87</text>
  </g>
  <g>
    <rect x="705" y="270" width="170" height="70" rx="8" fill="#22d3ee" opacity="0.14"/>
    <text x="790" y="292" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">frustration &#183; score</text>
    <text x="790" y="308" text-anchor="middle" fill="#64748b" font-size="10">head &#8594; softmax</text>
    <text x="790" y="328" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="700">1.04</text>
  </g>

  <!-- Footer notes -->
  <line x1="30" y1="370" x2="870" y2="370" stroke="#334155" stroke-width="1"/>
  <text x="450" y="395" text-anchor="middle" fill="#94a3b8" font-size="12">each question reads the state and its own options, but never the other questions</text>
  <text x="450" y="415" text-anchor="middle" fill="#64748b" font-size="11">values from a real jev-1.13.0 response (Cloudflare Workers AI docs)</text>
</svg>
