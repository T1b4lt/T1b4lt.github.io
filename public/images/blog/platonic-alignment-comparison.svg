<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="470" rx="16" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">Small and well-taught beats big</text>
  <text x="450" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">alignment with DINOv2 (mutual 10-NN, WIT-1024) &#183; Balestriero &amp; LeCun (2026), Table 3 &#183; authors' figures</text>

  <!-- Grid: 0 .. 0.20 over x 260..810 (2750 px per unit) -->
  <g stroke="#334155" stroke-width="1">
    <line x1="260" y1="85" x2="260" y2="400"/>
    <line x1="397.5" y1="85" x2="397.5" y2="400"/>
    <line x1="535" y1="85" x2="535" y2="400"/>
    <line x1="672.5" y1="85" x2="672.5" y2="400"/>
    <line x1="810" y1="85" x2="810" y2="400"/>
  </g>
  <g fill="#94a3b8" font-size="11" text-anchor="middle">
    <text x="260" y="418">0</text>
    <text x="397.5" y="418">0.05</text>
    <text x="535" y="418">0.10</text>
    <text x="672.5" y="418">0.15</text>
    <text x="810" y="418">0.20</text>
  </g>

  <!-- Row labels -->
  <g fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="end">
    <text x="245" y="114">good-view JEPA &#183; 109M</text>
    <text x="245" y="166">Qwen2.5-72B</text>
    <text x="245" y="218">Llama-3-70B</text>
    <text x="245" y="270">CLIP B/32 text</text>
    <text x="245" y="322">next-token &#183; 109M</text>
    <text x="245" y="374">bad-view JEPA &#183; 109M</text>
  </g>

  <!-- Bars -->
  <rect x="260" y="94" width="506" height="30" rx="4" fill="#22d3ee"/>
  <text x="774" y="114" fill="#22d3ee" font-size="13" font-weight="700">.184</text>

  <rect x="260" y="146" width="423.5" height="30" rx="4" fill="#64748b"/>
  <text x="691.5" y="166" fill="#e2e8f0" font-size="13" font-weight="700">.154</text>

  <rect x="260" y="198" width="415.25" height="30" rx="4" fill="#64748b"/>
  <text x="683.25" y="218" fill="#e2e8f0" font-size="13" font-weight="700">.151</text>

  <rect x="260" y="250" width="341" height="30" rx="4" fill="#64748b"/>
  <text x="609" y="270" fill="#e2e8f0" font-size="13" font-weight="700">.124</text>

  <rect x="260" y="302" width="305.25" height="30" rx="4" fill="#f97316"/>
  <text x="573.25" y="322" fill="#f97316" font-size="13" font-weight="700">.111</text>

  <rect x="260" y="354" width="242" height="30" rx="4" fill="#a78bfa"/>
  <text x="510" y="374" fill="#a78bfa" font-size="13" font-weight="700">.088</text>

  <!-- Note -->
  <text x="450" y="448" text-anchor="middle" fill="#94a3b8" font-size="12" font-style="italic">the three 109M models share data and architecture; the LLMs are evaluated as released</text>
</svg>
