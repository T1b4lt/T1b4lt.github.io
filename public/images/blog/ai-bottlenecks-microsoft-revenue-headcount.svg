<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="470" rx="16" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">Microsoft: revenue vs. headcount</text>
  <text x="450" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">cumulative growth since fiscal 2007 (fiscal years end June 30)</text>

  <!-- Grid -->
  <g stroke="#334155" stroke-width="1">
    <line x1="90" y1="350" x2="840" y2="350"/>
    <line x1="90" y1="300" x2="840" y2="300"/>
    <line x1="90" y1="250" x2="840" y2="250"/>
    <line x1="90" y1="200" x2="840" y2="200"/>
    <line x1="90" y1="150" x2="840" y2="150"/>
    <line x1="90" y1="100" x2="840" y2="100"/>
  </g>
  <line x1="90" y1="400" x2="840" y2="400" stroke="#64748b" stroke-width="1.5"/>
  <g fill="#94a3b8" font-size="11" text-anchor="end">
    <text x="80" y="404">0%</text>
    <text x="80" y="354">100%</text>
    <text x="80" y="304">200%</text>
    <text x="80" y="254">300%</text>
    <text x="80" y="204">400%</text>
    <text x="80" y="154">500%</text>
    <text x="80" y="104">600%</text>
  </g>
  <g fill="#94a3b8" font-size="11" text-anchor="middle">
    <text x="90" y="420">FY07</text>
    <text x="208.4" y="420">FY10</text>
    <text x="326.8" y="420">FY13</text>
    <text x="445.3" y="420">FY16</text>
    <text x="563.7" y="420">FY19</text>
    <text x="682.1" y="420">FY22</text>
    <text x="840" y="420">FY26</text>
  </g>

  <!-- 2022 marker -->
  <line x1="682.1" y1="268" x2="682.1" y2="400" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="676" y="372" text-anchor="end" fill="#94a3b8" font-size="11" font-style="italic">headcount flattens from FY22</text>

  <!-- Revenue -->
  <polyline fill="none" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="90,400 129.5,390.9 168.9,392.9 208.4,388.9 247.9,381.6 287.4,377.9 326.8,373.9 366.3,365.1 405.8,358.5 445.3,366.6 484.7,362 524.2,342.1 563.7,326.9 603.2,310.1 642.6,285.6 682.1,256.1 721.6,242.7 761.1,210.3 800.5,174.5 840,125.5"/>
  <circle cx="840" cy="125.5" r="5" fill="#fbbf24"/>
  <text x="830" y="112" text-anchor="end" fill="#fbbf24" font-size="13" font-weight="700">Revenue +549% · $331.8B</text>

  <!-- Headcount -->
  <polyline fill="none" stroke="#22d3ee" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="90,400 129.5,392.4 168.9,391.2 208.4,393.7 247.9,393.1 287.4,390.5 326.8,387.4 366.3,369 405.8,375.3 445.3,377.9 484.7,371.5 524.2,367.1 563.7,358.9 603.2,346.9 642.6,335.6 682.1,310.2 721.6,310.2 761.1,305.7 800.5,305.7 840,308.9"/>
  <circle cx="840" cy="308.9" r="5" fill="#22d3ee"/>
  <text x="830" y="330" text-anchor="end" fill="#22d3ee" font-size="13" font-weight="700">Headcount +182% · 223,000</text>

  <!-- Callout -->
  <rect x="110" y="110" width="290" height="58" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="125" y="133" fill="#e2e8f0" font-size="13" font-weight="700">Revenue per employee</text>
  <text x="125" y="155" fill="#94a3b8" font-size="12">$647K (FY07)  &#8594;  $1.49M (FY26)</text>

  <!-- Footnote -->
  <text x="450" y="455" text-anchor="middle" fill="#64748b" font-size="10.5">Source: Microsoft annual reports (Form 10-K), FY2007&#8211;FY2026. Revenue as reported; headcount as of June 30.</text>
</svg>
