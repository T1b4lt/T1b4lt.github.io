<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="420" rx="16" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">Generating word by word vs. deciding in one go</text>
  <text x="450" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">same question: which team should handle "Help! My payouts have been failing for 3 days."?</text>

  <!-- LLM row -->
  <rect x="30" y="75" width="840" height="140" rx="10" fill="#d97706" opacity="0.10"/>
  <rect x="30" y="75" width="4" height="140" rx="2" fill="#d97706"/>
  <text x="50" y="100" fill="#fbbf24" font-size="14" font-weight="700">LLM &#183; one full forward pass per token</text>
  <text x="850" y="100" text-anchor="end" fill="#94a3b8" font-size="12">~20 passes &#183; seconds &#183; sampled</text>
  <g font-size="12" fill="#e2e8f0" text-anchor="middle">
    <rect x="50" y="125" width="78" height="32" rx="6" fill="#d97706" opacity="0.25"/><text x="89" y="146">This</text>
    <rect x="138" y="125" width="78" height="32" rx="6" fill="#d97706" opacity="0.25"/><text x="177" y="146">sounds</text>
    <rect x="226" y="125" width="78" height="32" rx="6" fill="#d97706" opacity="0.25"/><text x="265" y="146">like</text>
    <rect x="314" y="125" width="78" height="32" rx="6" fill="#d97706" opacity="0.25"/><text x="353" y="146">it</text>
    <rect x="402" y="125" width="78" height="32" rx="6" fill="#d97706" opacity="0.25"/><text x="441" y="146">should</text>
    <rect x="490" y="125" width="78" height="32" rx="6" fill="#d97706" opacity="0.25"/><text x="529" y="146">probably</text>
    <rect x="578" y="125" width="78" height="32" rx="6" fill="#d97706" opacity="0.25"/><text x="617" y="146">go</text>
    <rect x="666" y="125" width="78" height="32" rx="6" fill="#d97706" opacity="0.25"/><text x="705" y="146">to</text>
    <rect x="754" y="125" width="96" height="32" rx="6" fill="#d97706" opacity="0.25"/><text x="802" y="146">billing&#8230;</text>
  </g>
  <g fill="none" stroke="#fbbf24" stroke-width="1.3" opacity="0.7">
    <path d="M89,162 C89,185 177,185 177,162"/>
    <path d="M177,162 C177,185 265,185 265,162"/>
    <path d="M265,162 C265,185 353,185 353,162"/>
    <path d="M353,162 C353,185 441,185 441,162"/>
    <path d="M441,162 C441,185 529,185 529,162"/>
    <path d="M529,162 C529,185 617,185 617,162"/>
    <path d="M617,162 C617,185 705,185 705,162"/>
    <path d="M705,162 C705,185 802,185 802,162"/>
  </g>
  <text x="450" y="205" text-anchor="middle" fill="#64748b" font-size="11">each token is fed back in to predict the next one &#8212; and your code still has to parse the prose</text>

  <!-- Decision model row -->
  <rect x="30" y="235" width="840" height="160" rx="10" fill="#0891b2" opacity="0.10"/>
  <rect x="30" y="235" width="4" height="160" rx="2" fill="#22d3ee"/>
  <text x="50" y="260" fill="#22d3ee" font-size="14" font-weight="700">Decision model &#183; one forward pass, all options scored at once</text>
  <text x="850" y="260" text-anchor="end" fill="#94a3b8" font-size="12">1 pass &#183; tens to hundreds of ms &#183; no sampling</text>

  <rect x="50" y="290" width="200" height="80" rx="8" fill="#22d3ee" opacity="0.18"/>
  <text x="150" y="325" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">state + question</text>
  <text x="150" y="345" text-anchor="middle" fill="#94a3b8" font-size="11">+ the allowed answers</text>

  <line x1="260" y1="330" x2="330" y2="330" stroke="#22d3ee" stroke-width="2"/>
  <polygon points="338,330 328,325 328,335" fill="#22d3ee"/>
  <text x="298" y="320" text-anchor="middle" fill="#64748b" font-size="10">1 pass</text>

  <g font-size="12">
    <text x="420" y="301" text-anchor="end" fill="#e2e8f0">billing</text>
    <rect x="430" y="290" width="300" height="14" rx="4" fill="#334155"/>
    <rect x="430" y="290" width="261" height="14" rx="4" fill="#22d3ee"/>
    <text x="745" y="301" fill="#22d3ee" font-weight="700">0.87</text>

    <text x="420" y="331" text-anchor="end" fill="#e2e8f0">technical</text>
    <rect x="430" y="320" width="300" height="14" rx="4" fill="#334155"/>
    <rect x="430" y="320" width="39" height="14" rx="4" fill="#67e8f9" opacity="0.6"/>
    <text x="745" y="331" fill="#94a3b8">0.13</text>

    <text x="420" y="361" text-anchor="end" fill="#e2e8f0">sales</text>
    <rect x="430" y="350" width="300" height="14" rx="4" fill="#334155"/>
    <text x="745" y="361" fill="#94a3b8">0.00</text>
  </g>
  <text x="800" y="335" text-anchor="middle" fill="#64748b" font-size="11">&#8594; JSON</text>
</svg>
