<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="470" rx="16" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">Three futures for AI infrastructure, 2026&#8211;2031</text>
  <text x="450" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">line width proportional to the author's estimated probability</text>

  <!-- Phases -->
  <rect x="100" y="80" width="116" height="320" fill="#334155" opacity="0.25"/>
  <text x="158" y="96" text-anchor="middle" fill="#94a3b8" font-size="11">short term</text>
  <text x="448" y="96" text-anchor="middle" fill="#94a3b8" font-size="11">medium term</text>

  <!-- Grid -->
  <g stroke="#334155" stroke-width="1">
    <line x1="216" y1="80" x2="216" y2="400"/>
    <line x1="332" y1="80" x2="332" y2="400"/>
    <line x1="448" y1="80" x2="448" y2="400"/>
    <line x1="564" y1="80" x2="564" y2="400"/>
    <line x1="680" y1="80" x2="680" y2="400"/>
  </g>
  <line x1="100" y1="400" x2="680" y2="400" stroke="#64748b" stroke-width="1.5"/>
  <line x1="100" y1="80" x2="100" y2="400" stroke="#64748b" stroke-width="1.5"/>
  <g fill="#94a3b8" font-size="11" text-anchor="middle">
    <text x="100" y="418">2026</text>
    <text x="216" y="418">2027</text>
    <text x="332" y="418">2028</text>
    <text x="448" y="418">2029</text>
    <text x="564" y="418">2030</text>
    <text x="680" y="418">2031</text>
  </g>
  <text x="50" y="240" text-anchor="middle" fill="#94a3b8" font-size="12" font-style="italic" transform="rotate(-90 50 240)">AI infrastructure investment &#8594;</text>

  <!-- Paths -->
  <polyline fill="none" stroke="#f87171" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" points="100,250 216,300 332,360 448,375 564,360 680,335"/>
  <polyline fill="none" stroke="#fbbf24" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" points="100,250 216,255 332,275 448,265 564,240 680,215"/>
  <polyline fill="none" stroke="#22c55e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" points="100,250 216,220 332,190 448,160 564,135 680,115"/>

  <!-- Today -->
  <circle cx="100" cy="250" r="7" fill="#e2e8f0"/>
  <text x="110" y="236" fill="#e2e8f0" font-size="11" font-weight="700">today</text>

  <!-- Labels -->
  <text x="695" y="112" fill="#22c55e" font-size="15" font-weight="700">Optimistic · 20%</text>
  <text x="695" y="130" fill="#94a3b8" font-size="11">the grid catches up</text>

  <text x="695" y="212" fill="#fbbf24" font-size="15" font-weight="700">Neutral · 50%</text>
  <text x="695" y="230" fill="#94a3b8" font-size="11">consolidation with damage</text>

  <text x="695" y="332" fill="#f87171" font-size="15" font-weight="700">Pessimistic · 30%</text>
  <text x="695" y="350" fill="#94a3b8" font-size="11">the tap is turned off</text>

  <!-- Footnote -->
  <text x="450" y="455" text-anchor="middle" fill="#64748b" font-size="10.5">Illustrative paths, not forecasts. Probabilities are the author's own estimate as of October 2026.</text>
</svg>
