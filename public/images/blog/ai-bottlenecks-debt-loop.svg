<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .dot { offset-path: path("M450,105 A220,140 0 0 1 670,245 A220,140 0 0 1 450,385 A220,140 0 0 1 230,245 A220,140 0 0 1 450,105"); offset-rotate: 0deg; animation: loop 6s linear infinite; }
    .d2 { animation-delay: -2s; } .d3 { animation-delay: -4s; }
    .exit { offset-path: path("M545,390 L690,390"); offset-rotate: 0deg; animation: out 6s ease-in infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes loop { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    @keyframes out { 0%, 70% { offset-distance: 0%; opacity: 0; } 75% { opacity: 1; } 95% { offset-distance: 100%; opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .dot, .exit, .pulse { animation: none; } .exit { opacity: 0; } }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="470" rx="16" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">The debt loop of an unplugged GPU</text>
  <text x="450" y="55" text-anchor="middle" fill="#94a3b8" font-size="12">every turn of the loop adds interest; only a grid connection turns hardware into revenue</text>

  <!-- Ring -->
  <ellipse cx="450" cy="245" rx="220" ry="140" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M560,123.8 A220,140 0 0 1 649.4,185.8"/>
    <path d="M640.5,315 A220,140 0 0 1 543,371.9"/>
    <path d="M340,366.2 A220,140 0 0 1 250.6,304.2"/>
    <path d="M259.5,175 A220,140 0 0 1 357,118.1"/>
  </g>

  <!-- Moving money -->
  <circle class="dot" r="7" fill="#f97316"/>
  <circle class="dot d2" r="7" fill="#f97316"/>
  <circle class="dot d3" r="7" fill="#f97316"/>

  <!-- Center -->
  <text x="450" y="240" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">no power = no revenue</text>
  <text x="450" y="259" text-anchor="middle" fill="#94a3b8" font-size="12">but interest keeps running</text>

  <!-- Nodes -->
  <g>
    <rect x="355" y="78" width="190" height="54" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="450" y="101" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700">1 · Borrow</text>
    <text x="450" y="120" text-anchor="middle" fill="#94a3b8" font-size="11">bonds, GPU-backed loans</text>

    <rect x="575" y="218" width="190" height="54" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="670" y="241" text-anchor="middle" fill="#22d3ee" font-size="14" font-weight="700">2 · Buy GPUs</text>
    <text x="670" y="260" text-anchor="middle" fill="#94a3b8" font-size="11">~$3B of racks a month (AWS)</text>

    <rect x="355" y="358" width="190" height="54" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="450" y="381" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">3 · Wait for power</text>
    <text x="450" y="400" text-anchor="middle" fill="#94a3b8" font-size="11">"dark GPUs" in warehouses</text>

    <rect class="pulse" x="129" y="212" width="202" height="66" rx="14" fill="none" stroke="#f97316" stroke-width="2"/>
    <rect x="135" y="218" width="190" height="54" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <text x="230" y="241" text-anchor="middle" fill="#f97316" font-size="14" font-weight="700">4 · Interest accrues</text>
    <text x="230" y="260" text-anchor="middle" fill="#94a3b8" font-size="11">$640M a quarter (CoreWeave)</text>
  </g>

  <!-- Exit -->
  <line x1="545" y1="390" x2="690" y2="390" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="617" y="380" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700">power on</text>
  <circle class="exit" r="7" fill="#22c55e"/>
  <rect x="695" y="360" width="180" height="60" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="785" y="384" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="700">Rental revenue</text>
  <text x="785" y="403" text-anchor="middle" fill="#94a3b8" font-size="11">pays interest, repays debt</text>

  <!-- Footnote -->
  <text x="450" y="455" text-anchor="middle" fill="#64748b" font-size="10.5">Figures: Business Insider (AWS racks, Aug 2026); CoreWeave Q2 2026 results (net interest expense). Simplified mechanism.</text>
</svg>
